[package]
name = "rgytui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
tempfile = "3"
rustfft = "6"
num-complex = "0.4"
async-trait = "0.1"
dirs = "5"
rfd = "0.15"
rayon = "1"
sys-locale = "0.3"
